<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>QuotaCrux 枢决 · video</title>
<link rel="icon" href="data:,">
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<style>
  :root { --bg: #F1EFE9; --ink: #111113; --grey: #8E8D88; --accent: #FF4D1F; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "PingFang SC", sans-serif; }
  #gl { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  /* soft vignette and fine grain over the 3D view */
  #vignette { background: radial-gradient(ellipse 75% 70% at 50% 45%, rgba(0,0,0,0) 55%, rgba(70,55,35,0.16) 100%); }
  #grain { opacity: 0.07; mix-blend-mode: multiply; }

  #brand { position: absolute; left: 0; top: 0; transform-origin: 0 0; white-space: nowrap; display: flex; align-items: baseline; gap: 28px; }
  #brand .name { font-family: "Avenir Next", sans-serif; font-weight: 800; font-size: 220px; letter-spacing: -7px; line-height: 1; }
  #brand .name span { display: inline-block; }
  #brand .cn { font-size: 104px; font-weight: 600; letter-spacing: 12px; }
  #brand .dot { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); align-self: center; }

  #tag { position: absolute; left: 76px; top: 150px; padding: 14px 28px 18px; border-radius: 14px; background: rgba(255, 255, 255, 0.9); box-shadow: 0 18px 40px -22px rgba(40, 30, 10, 0.45); }
  #tag .k { font-family: "Avenir Next", "PingFang SC", sans-serif; font-size: 28px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
  #tag .k b { margin-right: 14px; }
  #tag .v { font-size: 60px; font-weight: 600; line-height: 1.25; margin-top: 4px; }

  #sub { position: absolute; left: 76px; bottom: 70px; max-width: 1640px; display: flex; gap: 22px; align-items: stretch;
    padding: 20px 34px 20px 22px; border-radius: 14px; background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 18px 40px -22px rgba(40, 30, 10, 0.45); }
  #sub i { width: 8px; border-radius: 4px; background: var(--accent); flex: none; }
  #sub span { font-size: 42px; font-weight: 600; line-height: 1.42; }

  #hud { position: absolute; right: 76px; top: 64px; text-align: right; padding: 18px 30px 22px; border-radius: 14px;
    background: rgba(255, 255, 255, 0.9); box-shadow: 0 18px 40px -22px rgba(40, 30, 10, 0.45); min-width: 320px; }
  #hud .k { font-size: 26px; font-weight: 600; color: var(--grey); }
  #hud .v { font-family: "Avenir Next", sans-serif; font-weight: 800; font-size: 118px; line-height: 1; letter-spacing: -3px; }
  #hud .who { font-size: 24px; font-weight: 600; margin-top: 6px; }
  .float { position: absolute; font-family: "Avenir Next", sans-serif; font-weight: 800; font-size: 54px; color: var(--accent);
    transform: translate(-50%, -100%); text-shadow: 0 2px 0 #fff, 0 0 12px rgba(255,255,255,0.9); }

  .card { background: rgba(255, 255, 255, 0.92); border-radius: 18px; box-shadow: 0 24px 60px -30px rgba(40, 30, 10, 0.5); }
  .num { font-family: "Avenir Next", sans-serif; font-weight: 800; letter-spacing: -3px; line-height: 1; font-variant-numeric: tabular-nums; }
  .muted { color: var(--grey); }
  .acc { color: var(--accent); }

  #pin { position: absolute; transform: translate(-50%, -100%); padding: 8px 18px 10px; font-size: 30px; font-weight: 700; white-space: nowrap; }
  #pin::after { content: ""; position: absolute; left: 50%; bottom: -12px; margin-left: -10px; border: 10px solid transparent; border-top-color: rgba(255,255,255,0.92); border-bottom: 0; }
  #pin b { color: var(--accent); }

  .station { position: absolute; transform: translate(-50%, -50%); padding: 10px 22px 12px; font-size: 34px; font-weight: 700; white-space: nowrap; display: flex; gap: 12px; align-items: baseline; }
  .station small { font-family: "Avenir Next", sans-serif; font-size: 22px; font-weight: 800; color: var(--accent); }
  .station.on { background: var(--accent); color: #fff; }
  .station.on small { color: #fff; }
  #judge { position: absolute; transform: translate(-50%, -50%); text-align: center; padding: 14px 30px 16px; }
  #judge .a { font-size: 40px; font-weight: 700; }
  #judge .b { font-size: 24px; font-weight: 600; color: var(--grey); margin-top: 2px; }
  #chipLabel { position: absolute; transform: translate(-50%, -100%); padding: 6px 14px 8px; font-size: 24px; font-weight: 700; white-space: nowrap; border-radius: 10px; color: #fff; background: var(--ink); }
  #budget { position: absolute; right: 76px; top: 64px; padding: 20px 30px 24px; }
  #budget .k { font-size: 26px; font-weight: 600; color: var(--grey); }
  #budget .row { display: flex; gap: 34px; margin-top: 10px; }
  #budget .row div { font-size: 24px; font-weight: 600; color: var(--grey); }
  #budget .row .num { font-size: 76px; color: var(--ink); letter-spacing: -2px; display: block; margin-bottom: 6px; }

  #divider { position: absolute; left: 959px; top: 0; width: 2px; height: 1080px; background: rgba(17,17,19,0.18); }
  .side { position: absolute; top: 64px; padding: 18px 28px 22px; text-align: right; min-width: 300px; }
  .side .k { font-size: 26px; font-weight: 600; color: var(--grey); }
  .side .num { font-size: 104px; margin-top: 6px; }
  .side .who { font-size: 26px; font-weight: 700; margin-top: 6px; }
  #sideL { right: 1004px; }
  #sideR { right: 44px; }

  #panel { position: absolute; inset: 0; background: rgba(241, 239, 233, 0.78); backdrop-filter: blur(14px) saturate(0.9); }
  .pane { position: absolute; }
  .center { left: 50%; top: 47%; transform: translate(-50%, -50%); text-align: center; padding: 44px 80px 52px; }
  .center .k { font-size: 36px; font-weight: 600; color: var(--grey); }
  .center .hero { font-size: 230px; margin: 14px 0 8px; }
  .center .k2 { font-size: 40px; font-weight: 700; }

  #p-chart { left: 76px; right: 76px; top: 296px; height: 590px; padding: 26px 40px 0; }
  #p-chart .head { display: flex; justify-content: space-between; align-items: flex-end; }
  #p-chart .ttl { font-size: 34px; font-weight: 700; }
  #p-chart .ttl span { font-size: 26px; font-weight: 600; color: var(--grey); margin-left: 14px; }
  #p-chart .legend { display: flex; gap: 30px; font-size: 26px; font-weight: 600; color: #4a4946; }
  #p-chart .legend i { display: inline-block; width: 18px; height: 18px; border-radius: 50%; margin-right: 10px; vertical-align: -1px; }
  #p-chart .best { text-align: right; }
  #p-chart .best .k { font-size: 24px; font-weight: 600; color: var(--grey); }
  #p-chart .best .num { font-size: 76px; letter-spacing: -2px; }
  #p-chart .best .who { font-size: 24px; font-weight: 700; margin-top: 4px; }
  #p-chart svg text { font-family: "PingFang SC", sans-serif; }

  #p-result { left: 50%; top: 56%; transform: translate(-50%, -50%); padding: 40px 90px 48px; text-align: center; white-space: nowrap; }
  #p-result .k { font-size: 34px; font-weight: 600; color: var(--grey); }
  #p-result .pair { display: flex; align-items: center; justify-content: center; gap: 40px; margin-top: 18px; }
  #p-result .pair .num { font-size: 116px; }
  #p-result .pair .arrow { font-size: 90px; color: var(--grey); font-weight: 300; }
  #p-result .pct { font-size: 200px; color: var(--accent); margin-top: 10px; letter-spacing: -6px; }
  #p-result .foot { font-size: 36px; font-weight: 700; margin-top: 12px; }

  #p-routing { left: 76px; right: 76px; top: 296px; padding: 34px 50px 30px; }
  .rt { display: grid; grid-template-columns: 430px 1fr 1fr; column-gap: 60px; row-gap: 26px; align-items: center; }
  .rt .h { font-size: 28px; font-weight: 700; color: var(--grey); padding-bottom: 4px; }
  .rt .lab { font-size: 38px; font-weight: 700; white-space: nowrap; }
  .rt .lab small { display: block; font-size: 22px; font-weight: 600; color: var(--grey); margin-top: 2px; }
  .rt .bar { position: relative; height: 62px; }
  .rt .bar b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 6px 6px 0; background: #B9B5AC; }
  .rt .bar span { position: absolute; top: 50%; transform: translateY(-50%); font-family: "Avenir Next", sans-serif; font-weight: 800; font-size: 40px; white-space: nowrap; }
  .rt .bar.hot b { background: var(--accent); }
  .rt .note { grid-column: 1 / -1; font-size: 24px; font-weight: 600; color: var(--grey); margin-top: 6px; }

  .tiles { left: 76px; right: 76px; top: 330px; display: flex; gap: 40px; }
  .tile { flex: 1; padding: 44px 50px 50px; }
  .tile .num { font-size: 190px; letter-spacing: -6px; }
  .tile .num small { font-size: 0.5em; letter-spacing: -2px; margin-left: 6px; }
  .tile .a { font-size: 40px; font-weight: 700; margin-top: 18px; }
  .tile .b { font-size: 28px; font-weight: 600; color: var(--grey); margin-top: 8px; }

  #p-end { left: 76px; right: 76px; bottom: 76px; display: flex; justify-content: space-between; align-items: flex-end; }
  #p-end .url { padding: 26px 40px 30px; }
  #p-end .url .a { font-size: 44px; font-weight: 700; }
  #p-end .url .b { font-family: "Avenir Next", sans-serif; font-size: 40px; font-weight: 700; color: var(--grey); margin-top: 10px; }
  #p-end .qr { padding: 22px; width: 250px; height: 250px; }
  #p-end .qr img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="gl" width="1920" height="1080"></canvas>
<div class="layer" id="vignette"></div>
<svg class="layer" id="grain" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="layer" id="ui">
<div id="stations"></div><div id="judge" class="card"><div class="a">外部裁判</div><div class="b">隔离沙箱 · 计时 · 判分</div></div><div id="chipLabel"></div>
<div id="divider"></div><div class="side card" id="sideL"></div><div class="side card" id="sideR"></div>
<div id="pin" class="card"></div>
<div id="panel"></div>
<div class="pane card center" id="p-cost"></div>
<div class="pane card" id="p-chart"></div>
<div class="pane card" id="p-result"></div>
<div class="pane card" id="p-routing"></div>
<div class="pane tiles" id="p-func"></div>
<div class="pane tiles" id="p-ledger"></div>
<div class="pane" id="p-end"></div>
<div id="budget" class="card"></div>
<div id="brand"></div><div id="tag"></div><div id="hud"></div><div id="sub"><i></i><span></span></div><div class="float" id="delta"></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
